<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymOps — mobiele preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: #0A0A0F;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 28px 16px;
  }
  .label { color: rgba(255,255,255,.55); font-size: 13px; font-weight: 500; letter-spacing: .02em; }
  .label b { color: #fff; font-weight: 700; }
  /* iPhone-style bezel */
  .device {
    width: 390px;
    max-width: 100%;
    height: 844px;
    max-height: calc(100vh - 90px);
    background: #000;
    border-radius: 52px;
    padding: 12px;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,.7), 0 0 0 2px #1c1c22;
    position: relative;
  }
  .device::after {
    /* dynamic island */
    content: "";
    position: absolute;
    top: 24px; left: 50%; transform: translateX(-50%);
    width: 112px; height: 30px;
    background: #000; border-radius: 999px; z-index: 5;
  }
  iframe {
    width: 100%; height: 100%;
    border: none; border-radius: 42px; background: #fff;
    display: block;
  }
</style>
</head>
<body>
  <div class="label">Mobiele weergave - <b>scroll in de telefoon</b> om de vier blokken te zien</div>
  <div class="device">
    <iframe src="index.html" title="GymOps mobiel"></iframe>
  </div>
</body>
</html>
